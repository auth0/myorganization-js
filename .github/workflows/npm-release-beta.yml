name: Publish beta release to npm

#
# Reusable workflow that publishes a beta prerelease to npm (dist-tag `beta`).
# It is called by `release.yml` whenever a PR is merged into the `beta` branch
# (every fern-bot regeneration PR or human PR). The version is computed from the
# existing tags by the compute-next-version action, the version files are
# stamped, a CHANGELOG.md entry is generated from the merged squash-commit
# message, the package is published to npm, the commit is tagged, and a GitHub
# prerelease is created.
#
# Routing through `release.yml` (rather than triggering directly) means a single
# entry workflow is the npm trusted publisher for both the stable and beta
# tracks, matching npm's one-trusted-publisher-per-package limit.
#
# This runs against the `beta` branch, so CHANGELOG.md here is the beta track's
# own changelog and never collides with the stable changelog on `main`.
#
# Security notes:
#   - Reached via `pull_request` (NOT `pull_request_target`) in the caller. PRs
#     from forks run with a read-only token and no access to secrets, so a
#     malicious fork PR cannot reach the release credentials. All real inflow
#     (fern-bot, org members) comes from same-repo branches, which do have the
#     needed access.
#   - The workflow never executes checked-out PR source before publishing beyond
#     the repo's own build; it reads the merge commit message and stamps files.
#     Untrusted text is handled via shell variables/`env:`, never interpolated
#     into `run:` via `${{ }}`.
#   - npm publish uses OIDC trusted publishing with provenance; no long-lived
#     npm token is stored. Permissions default to none and are granted minimally.
#

on:
    workflow_call:
        inputs:
            node-version:
                required: true
                type: string
            require-build:
                default: true
                type: string
        secrets:
            github-token:
                required: true

# Least privilege: grant nothing by default; the job opts into exactly what it
# needs (publishing to npm with provenance and pushing the release commit/tag).
permissions: {}

jobs:
    beta-release:
        # Guard against forks running the release logic. The caller (release.yml)
        # already gates on the merge/dispatch event and the target branch.
        if: github.repository == 'auth0/myorganization-js'
        runs-on: ubuntu-latest
        environment: release
        permissions:
            contents: write # push the release commit and tag
            id-token: write # OIDC trusted publishing + provenance

        steps:
            # Checkout the beta branch with full history so tags are available
            # to compute-next-version.
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  fetch-depth: 0
                  ref: beta

            # Compute the next beta version from the existing tags.
            - id: get_version
              uses: ./.github/actions/compute-next-version
              with:
                  track: beta

            # Defense in depth: refuse to proceed if the computed tag already
            # exists, so a re-run can never overwrite a published release or
            # create a duplicate release commit. Mirrors the stable pipeline.
            - id: tag_exists
              uses: ./.github/actions/tag-exists
              with:
                  tag: ${{ steps.get_version.outputs.version }}
                  token: ${{ secrets.github-token }}

            - if: steps.tag_exists.outputs.exists == 'true'
              shell: bash
              run: |
                  echo "::error::Tag ${VERSION} already exists; aborting to avoid overwriting a published release."
                  exit 1
              env:
                  VERSION: ${{ steps.get_version.outputs.version }}

            # Toolchain. npm is pinned to ^11 (OIDC trusted publishing needs
            # >=11.5.1, and npm 12 raises the Node engine floor above the pinned
            # runtime), matching the stable publish action.
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ inputs.node-version }}
                  registry-url: "https://registry.npmjs.org"

            - name: Install npm with OIDC trusted publishing support
              shell: bash
              run: npm install -g npm@^11

            - name: Install pnpm
              uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # pin@v4.2.0

            - name: Install dependencies
              shell: bash
              run: pnpm install --frozen-lockfile

            # Build the release notes from the structured squash-commit message
            # of the merged PR. A combined beta PR mixes stable-mirrored and
            # beta-only changes in one squash commit, which cannot be told apart
            # from code or paths, so the author marks them at merge time:
            #
            #   <!-- BETA -->
            #   - feat: add lifecycle delete-member-invitations (Beta)
            #   <!-- /BETA -->
            #   <!-- STABLE -->
            #   - fix: correct pagination cursor handling
            #   <!-- /STABLE -->
            #
            # If the markers are absent we fall back to the raw commit subject so
            # the release never produces empty notes.
            - id: notes
              name: Generate release notes
              shell: bash
              run: |
                  MSG=$(git log -1 --pretty='%B' HEAD)

                  extract() { # $1=open marker  $2=close marker
                    printf '%s\n' "${MSG}" | awk -v o="$1" -v c="$2" '
                      $0 ~ o {grab=1; next}
                      $0 ~ c {grab=0}
                      grab {print}
                    ' | sed '/^[[:space:]]*$/d'
                  }

                  BETA_SECTION=$(extract '<!-- BETA -->' '<!-- /BETA -->')
                  STABLE_SECTION=$(extract '<!-- STABLE -->' '<!-- /STABLE -->')

                  # Unpredictable heredoc delimiter so untrusted commit-message
                  # content cannot forge the terminator and inject step outputs.
                  DELIM="RELEASE_NOTES_$(openssl rand -hex 16)"
                  {
                    echo "RELEASE_NOTES<<${DELIM}"
                    if [ -z "${BETA_SECTION}" ] && [ -z "${STABLE_SECTION}" ]; then
                      echo "**Beta**"
                      echo "- $(printf '%s\n' "${MSG}" | head -1)"
                    else
                      echo "**Beta**"
                      if [ -n "${BETA_SECTION}" ]; then
                        echo "${BETA_SECTION}"
                      else
                        echo "- No beta-only changes in this release."
                      fi
                      echo ""
                      echo "**Stable (from main)**"
                      if [ -n "${STABLE_SECTION}" ]; then
                        echo "${STABLE_SECTION}"
                      else
                        echo "- No stable changes in this release."
                      fi
                    fi
                    echo "${DELIM}"
                  } >> "$GITHUB_OUTPUT"

            # Stamp the version into .version, package.json and src/version.ts,
            # and prepend the CHANGELOG.md entry. Only edits files on disk; the
            # commit is created separately through the GitHub API so it is signed.
            - name: Stamp version files and changelog
              shell: bash
              run: |
                  echo "${VERSION}" > .version
                  npm version "${VERSION}" --no-git-tag-version --allow-same-version >/dev/null
                  sed -i -E 's/export const SDK_VERSION = ".*";/export const SDK_VERSION = "'"${VERSION}"'";/' src/version.ts

                  DATE=$(date -u +%Y-%m-%d)
                  [ -f CHANGELOG.md ] || printf '# Change Log\n\n' > CHANGELOG.md
                  {
                    head -2 CHANGELOG.md
                    echo "## [v${VERSION}](https://github.com/auth0/myorganization-js/tree/v${VERSION}) (${DATE})"
                    echo ""
                    echo "${RELEASE_NOTES}"
                    echo ""
                    tail -n +3 CHANGELOG.md
                  } > CHANGELOG.md.tmp
                  mv CHANGELOG.md.tmp CHANGELOG.md
              env:
                  VERSION: ${{ steps.get_version.outputs.version }}
                  RELEASE_NOTES: ${{ steps.notes.outputs.RELEASE_NOTES }}

            # Build and publish to npm on the `beta` dist-tag from the stamped
            # working tree. Provenance is emitted via OIDC (id-token: write).
            - name: Build package
              if: inputs.require-build == 'true'
              shell: bash
              run: pnpm build

            - name: Validate package
              shell: bash
              run: pnpm lint:package

            - name: Publish beta to npm
              shell: bash
              run: npm publish --provenance --tag beta

            # Create the release commit through the GitHub API. Commits created
            # via the API are signed by GitHub server-side, so the release commit
            # shows as "Verified" with no GPG key to manage. The commit is built
            # from blobs/tree/commit and the `beta` ref is fast-forwarded to it.
            - id: stamp
              name: Create signed release commit
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  VERSION: ${{ steps.get_version.outputs.version }}
              with:
                  script: |
                      const fs = require('fs');
                      const { owner, repo } = context.repo;
                      const branch = 'beta';
                      const version = process.env.VERSION;
                      const files = ['.version', 'package.json', 'src/version.ts', 'CHANGELOG.md'];

                      const ref = await github.rest.git.getRef({
                        owner, repo, ref: `heads/${branch}`,
                      });
                      const parentSha = ref.data.object.sha;
                      const parentCommit = await github.rest.git.getCommit({
                        owner, repo, commit_sha: parentSha,
                      });

                      const tree = [];
                      for (const path of files) {
                        const blob = await github.rest.git.createBlob({
                          owner, repo,
                          content: fs.readFileSync(path, 'utf8'),
                          encoding: 'utf-8',
                        });
                        tree.push({ path, mode: '100644', type: 'blob', sha: blob.data.sha });
                      }
                      const newTree = await github.rest.git.createTree({
                        owner, repo, base_tree: parentCommit.data.tree.sha, tree,
                      });

                      const commit = await github.rest.git.createCommit({
                        owner, repo,
                        message: `Release v${version}`,
                        tree: newTree.data.sha,
                        parents: [parentSha],
                      });
                      await github.rest.git.updateRef({
                        owner, repo, ref: `heads/${branch}`, sha: commit.data.sha,
                      });

                      core.setOutput('SHA', commit.data.sha);
                      core.notice(`Created signed release commit ${commit.data.sha} for v${version}`);

            # Create the GitHub prerelease. The tag is created at the signed
            # release commit, so it points at the verified commit.
            - uses: ./.github/actions/release-create
              with:
                  token: ${{ secrets.github-token }}
                  name: ${{ steps.get_version.outputs.version }}
                  body: ${{ steps.notes.outputs.RELEASE_NOTES }}
                  tag: ${{ steps.get_version.outputs.version }}
                  commit: ${{ steps.stamp.outputs.SHA }}
                  prerelease: true
