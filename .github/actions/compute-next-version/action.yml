name: Compute the next version for a release track

#
# Computes the next version for either the stable or beta track from the
# existing git tags, which are treated as the single source of truth.
#
# Tags in this repo are unprefixed semver (e.g. `1.1.1`, `2.0.0-beta.0`).
#
# While the 2.x line is being cut, the base is *seeded* at 2.0.0: until a
# `2.MINOR.PATCH` stable tag exists, both tracks anchor on 2.0.0. Once 2.0.0
# ships, the base rolls forward to the next minor after the latest 2.x stable
# automatically, so no shared state file is needed.
#
#   - stable: 2.0.0 until a 2.x stable tag exists, then 2.(latest_minor+1).0
#   - beta:   <base>-beta.N, where <base> is the stable base above and N
#             auto-increments from existing beta tags for that base (first = 0)
#

inputs:
    track:
        description: 'Release track: "stable" or "beta".'
        required: true

outputs:
    version:
        value: ${{ steps.compute.outputs.VERSION }}

runs:
    using: composite

    steps:
        - id: compute
          shell: bash
          run: |
              set -euo pipefail
              git fetch --tags --quiet

              # Latest clean stable tag on the 2.x line (2.MINOR.PATCH, no
              # prerelease suffix). `sort -V` orders by semver so 2.10.0 > 2.9.0.
              LATEST_STABLE=$(git tag --list | grep -E '^2\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)

              # Seed the base at 2.0.0 until the first 2.x stable exists; after
              # that, roll forward to the next minor after the latest 2.x stable.
              if [ -z "${LATEST_STABLE}" ]; then
                BASE="2.0.0"
              else
                BASE=$(echo "${LATEST_STABLE}" | awk -F. '{printf "%s.%d.0", $1, $2+1}')
              fi

              if [ "${TRACK}" = "stable" ]; then
                VERSION="${BASE}"
                echo "::notice::compute-next-version (stable): latest_stable=${LATEST_STABLE:-<none>} -> ${VERSION}"
              elif [ "${TRACK}" = "beta" ]; then
                # Only beta tags whose base is exactly BASE, with a numeric suffix.
                LAST_N=$(git tag --list | grep -E "^${BASE}-beta\.[0-9]+$" | sed -E 's/.*-beta\.//' | sort -n | tail -1 || true)
                if [ -z "${LAST_N}" ]; then
                  N=0
                else
                  N=$(( LAST_N + 1 ))
                fi
                VERSION="${BASE}-beta.${N}"
                echo "::notice::compute-next-version (beta): base=${BASE} last_beta_n=${LAST_N:-<none>} -> ${VERSION}"
              else
                echo "::error::Unknown track '${TRACK}'. Expected 'stable' or 'beta'." >&2
                exit 1
              fi

              echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          env:
              TRACK: ${{ inputs.track }}
